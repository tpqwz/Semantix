name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: semantix-linux-x64
          - os: windows-latest
            artifact: semantix-win-x64
          - os: macos-latest
            artifact: semantix-osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Stage the executable
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          if [ -f target/release/semantix.exe ]; then
            cp target/release/semantix.exe dist/semantix.exe
          else
            cp target/release/semantix dist/semantix
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/semantix*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Archive each folder
        shell: bash
        run: |
          set -eu
          cd dist
          for dir in semantix-*; do
            tar -czf "$dir.tar.gz" "$dir"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
