name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: semantix-linux-x64
            target: ""
          - os: windows-latest
            artifact: semantix-win-x64
            target: ""
          # Hosted arm64 Macs are not being assigned. The Intel image
          # cross-compiles the same aarch64-apple-darwin executable.
          - os: macos-15-intel
            artifact: semantix-osx-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Test
        run: cargo test
      - name: Build
        shell: bash
        run: |
          set -eu
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target "${{ matrix.target }}"
          else
            cargo build --release
          fi
      - name: Stage the executable
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          root=target/${{ matrix.target }}/release
          if [ -z "${{ matrix.target }}" ]; then
            root=target/release
          fi
          if [ -f "$root/semantix.exe" ]; then
            cp "$root/semantix.exe" dist/semantix.exe
          else
            cp "$root/semantix" dist/semantix
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/semantix*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Archive each folder
        shell: bash
        run: |
          set -eu
          cd dist
          for dir in semantix-*; do
            tar -czf "$dir.tar.gz" "$dir"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          generate_release_notes: true
